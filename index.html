<!DOCTYPE html>
<html lang="ru" style="background:#131417">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131417">
<title>Team Guide</title>
<style>html,body{background:#131417;color:#ecebe6}</style>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="initTg()"></script>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#131417;--panel:#1c1e22;--panel2:#262a30;--line:#34373d;--text:#ecebe6;--hint:#8f939b;--live:#e8352f;--prev:#2eb872;--warn:#f0b14a;--head:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:16px/1.45 var(--body);padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));min-height:100vh}
h1,h2,h3{font-family:var(--head);margin:0;font-weight:700;line-height:1.05}
h1{font-size:44px}
.sub{color:var(--hint);margin:6px 0 20px}
.back{all:unset;color:var(--hint);padding:6px 0 14px;cursor:pointer;display:block}

/* главная */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{all:unset;box-sizing:border-box;cursor:pointer;border-radius:20px;padding:18px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;background:var(--panel);border-top:4px solid var(--c);transition:transform .12s}
.big:active{transform:scale(.97)}
.big svg{width:34px;height:34px;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.big h2{font-size:30px}
.big span{color:var(--hint);font-size:14px;display:block;margin-top:3px}

/* планы */
.tabs{display:flex;gap:8px;margin:0 0 18px}
.tabs button{all:unset;flex:1;text-align:center;padding:11px 0;border-radius:14px;background:var(--panel);color:var(--hint);font:700 24px var(--head);cursor:pointer}
.tabs button.on{background:var(--live);color:#fff}
.empty{background:var(--panel);border-radius:16px;padding:22px 16px;color:var(--hint);text-align:center}
.grp{margin:0 0 22px}
.grp h2{font-size:30px}
.grp p{margin:3px 0 10px;color:var(--hint)}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.fr{flex:none;width:78%;scroll-snap-align:center}
.fr .vf{aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;background:#0c0d0f}
.fr img{width:100%;height:100%;object-fit:cover;display:block}
.fr small{display:block;margin-top:6px;color:var(--hint);font-size:13px}

/* правила */
.rule{display:flex;gap:14px;align-items:center;background:var(--panel);border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:17px;line-height:1.3}
.rule b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--prev);color:#06150d;font-size:16px}
.rule.no b{background:var(--live);color:#fff}

/* техника */
.order{background:var(--panel);border-left:4px solid var(--prev);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.dev{background:var(--panel);border-radius:16px;margin-bottom:10px;overflow:hidden}
.dev>button{all:unset;box-sizing:border-box;width:100%;padding:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.dev h3{font-size:25px}
.dev em{font-style:normal;color:var(--hint);font-size:14px}
.dev .st{display:none;padding:0 16px 8px}
.dev.open .st{display:block}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.step.done .chk{background:var(--prev);border-color:var(--prev)}
.step.done .chk:after{content:"";width:6px;height:11px;border:solid #06150d;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.step.done span{color:var(--hint)}
.reset{all:unset;display:block;text-align:center;color:var(--hint);padding:14px;cursor:pointer}
</style>
</head>

];
const GEAR=[
 {n:'Пульт и Hollyland',s:'Обычно уже подключены, только проверь',st:['Включи пульт (ATEM) и Hollyland.','Проверь, что на пульте видны все 4 камеры.','Нажми на каждую камеру: картинка есть.','Проверь звук в тестовой трансляции по ссылке.']},
 {n:'Камера 1',s:'На штативе, HDMI сразу в пульт',st:['Включи камеру.','HDMI-кабель от камеры вставлен в пульт.','Нажми эту камеру на пульте: картинка есть.','Фокус проверь по глазам.']},
 {n:'Камера 2',s:'Общий зал, ходит, через Hollyland',st:['Включи камеру.','На камере стоит передатчик Hollyland.','Приёмник на пульте ловит сигнал.','На пульте картинка есть без задержки и обрывов.']},
 {n:'Камеры 3 и 4',s:'Монитор, потом Hollyland, потом пульт',st:['Включи камеру.','Картинка идёт на монитор камеры.','С монитора картинка уходит в Hollyland.','На пульте есть картинка без обрывов.','Фокус проверь по глазам.']},
 {n:'Экран и ProPresenter',s:'Прямо на экран',st:['Включи счётчик за правой кулисой.', 'Включи усилитель.', 'HDMI от усилителя в MacBook через переходник.', 'Сетевой кабель тоже в переходник.', 'Запусти ProPresenter и включи выход на экран.']}
];
let done=load('done3',{}),openK=null,screen='home',shotsTab=3;

function home(){return `<h1>Team Guide</h1><p class="sub">Медиаслужение</p><div class="menu">
 <button class="big" style="--c:var(--live)" data-go="shots">${ICON.shots}<div><h2>Планы камер</h2><span>По каждой камере</span></div></button>
 <button class="big" style="--c:var(--warn)" data-go="rules">${ICON.rules}<div><h2>Главные правила</h2><span>6 пунктов</span></div></button>
 <button class="big" style="--c:var(--prev)" data-go="gear">${ICON.gear}<div><h2>Включить технику</h2><span>Шаг за шагом</span></div></button>
 ${ME&&ME.owner?`<button class="big" style="--c:#f0b14a" data-go="admins">${ICON.rules}<div><h2>Админы</h2><span>Кому дать права</span></div></button>`:''}
 <button class="big" style="--c:#b58cff" data-go="crew">${ICON.crew}<div><h2>Кто на служении</h2><span>Запишись на место</span></div></button>
 <button class="big" style="--c:#6aa8ff" data-go="slides">${ICON.slides}<div><h2>Слайды</h2><span>ProPresenter</span></div></button></div>`}
const back='<button class="back" data-go="home">‹ Назад</button>';
const CAM={
 1:{r:'На штативе',g:[]},
 2:{r:'Общий зал, ходит',g:[]},
 3:{r:'Музыканты, вокалисты, проповедник',g:[0,1,2,3]},
 4:{r:'',g:[]}};
function shots(){const c=CAM[shotsTab];
 const tabs='<div class="tabs">'+[1,2,3,4].map(n=>`<button data-tab="${n}" class="${n===shotsTab?'on':''}">${n}</button>`).join('')+'</div>';
 const body=c.g.length?c.g.map(i=>{const g=EX[i];return `<div class="grp"><h2>${g.t}</h2><p>${g.p}</p><div class="strip">${g.f.map(x=>`<div class="fr"><div class="vf"><img src="${IMG[x[0]]}" alt=""></div><small>${x[1]}</small></div>`).join('')}</div></div>`}).join(''):'<div class="empty">Планы этой камеры добавим позже.</div>';
 return back+'<h1>Камера '+shotsTab+'</h1><p class="sub">'+(c.r||' ')+'</p>'+tabs+body}
function rules(){return back+'<h1>Главные правила</h1><p class="sub"> </p>'+RULES.map(r=>`<div class="rule ${r[1]?'no':''}"><b>${r[1]?'✕':'✓'}</b><div>${r[0]}</div></div>`).join('')}
function dev(g,i){const k='g'+i+'_',n=g.st.length,d=g.st.filter((_,j)=>done[k+j]).length;
 return `<div class="dev ${openK===k?'open':''}"><button data-open="${k}"><div><h3>${g.n}</h3><em>${g.s}</em></div><em>${d}/${n}</em></button><div class="st">${g.st.map((t,j)=>`<div class="step ${done[k+j]?'done':''}" data-s="${k+j}"><div class="chk"></div><span>${t}</span></div>`).join('')}</div></div>`}
function gear(){return back+'<h1>Включить технику</h1><p class="sub"> </p><div class="order">Порядок: пульт и Hollyland → камеры → экран и ProPresenter.</div>'+GEAR.map(dev).join('')+'<button class="reset" data-reset>Сбросить отметки</button>'}
function slides(){return back+'<h1>Слайды</h1><p class="sub">Как подключить ProPresenter</p>'+['Включи счётчик за правой кулисой.', 'Включи усилитель.', 'HDMI от усилителя в MacBook через переходник.', 'Сетевой кабель тоже в переходник.', 'Запусти ProPresenter и включи выход на экран.'].map((t,i)=>`<div class="rule"><b style="background:var(--text)">${i+1}</b><div>${t}</div></div>`).join('')}

const ROLES=['Режиссёр','Камера 1','Камера 2','Камера 3','Камера 4','Слайды'];
let ME=null,crewData=null,crewUsers=[],crewErr='',crewBusy=false,crewDraft={},admData=null,admErr='';
const escH=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WEEK=(()=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+(7-d.getDay())%7);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())})();
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Init':(tg&&tg.initData)||''},body:body?JSON.stringify(body):undefined});if(r.status===401)throw new Error('auth');if(!r.ok)throw new Error(r.status);return r.json()}
const note=m=>{try{tg.showAlert(m)}catch(e){alert(m)}};
const errTxt=e=>e.message==='auth'?'Открой это приложение через бота в Telegram.':'Не удалось загрузить. Проверь интернет.';
async function loadMe(){try{ME=await api('/api/me');if(screen==='home')render(1)}catch(e){}}
async function loadCrew(){crewBusy=true;try{const j=await api('/api/crew?week='+WEEK);crewData=j.rows;crewUsers=j.users||[];ME=j.me;crewDraft={};j.rows.forEach(r=>crewDraft[r.role]=r.uid);crewErr=''}catch(e){crewData=[];crewErr=errTxt(e)}crewBusy=false;if(screen==='crew')render(1)}
async function crewSave(){if(crewBusy)return;crewBusy=true;try{const j=await api('/api/crew/save',{week:WEEK,items:ROLES.map(r=>({role:r,uid:crewDraft[r]||0}))});note('Сохранено. Сообщение получили: '+j.sent+' из '+j.total+'.')}catch(e){note('Не получилось сохранить.')}crewBusy=false;loadCrew()}
function crew(){if(crewData===null&&!crewBusy)loadCrew();const m={};(crewData||[]).forEach(r=>m[r.role]=r);const adm=ME&&ME.admin;
 const d=new Date(WEEK+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
 const sel='width:100%;margin-top:6px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit';
 return back+'<h1>Кто на служении</h1><p class="sub">Воскресенье, '+d+'</p>'+(crewErr?'<div class="order">'+crewErr+'</div>':'')+(crewData===null?'<div class="order">Загружаю…</div>':'')+
 ROLES.map(r=>{const x=m[r];return '<div class="rule"><div style="flex:1"><b style="background:none;color:var(--hint);width:auto">'+r+'</b>'+(adm?'<select style="'+sel+'" data-pick="'+r+'"><option value="0">Свободно</option>'+crewUsers.map(u=>'<option value="'+u.id+'"'+(crewDraft[r]==u.id?' selected':'')+'>'+escH(u.name)+'</option>').join('')+'</select>':'<div>'+(x?escH(x.name):'<span style="color:var(--hint)">Пока не назначен</span>')+'</div>')+'</div></div>'}).join('')+
 (adm?'<button class="reset" style="background:var(--prev);color:#fff;border:0" data-save>Сохранить и разослать всем</button><p class="sub" style="margin-top:10px">В списке только те, кто уже открывал бота. Всем придёт сообщение от бота.</p>':'')}
async function loadAdm(){try{admData=(await api('/api/admins')).users;admErr=''}catch(e){admData=[];admErr=errTxt(e)}if(screen==='admins')render(1)}
function admins(){if(admData===null)loadAdm();return back+'<h1>Админы</h1><p class="sub">Админ может назначать людей на служение</p>'+(admErr?'<div class="order">'+admErr+'</div>':'')+(admData===null?'<div class="order">Загружаю…</div>':'')+(admData&&!admData.length&&!admErr?'<div class="order">Пока никого нет. Люди появляются здесь после того, как откроют бота.</div>':'')+
 (admData||[]).map(u=>'<div class="rule"><div style="flex:1"><div>'+escH(u.name)+'</div>'+(u.username?'<small style="color:var(--hint)">@'+escH(u.username)+'</small>':'')+'</div><button class="reset" style="margin:0" data-adm="'+u.id+':'+(u.adm?0:1)+'">'+(u.adm?'Снять админа':'Сделать админом')+'</button></div>').join('')}
const V={home,shots,rules,gear,slides,crew,admins};
function render(keep){$('#app').innerHTML=V[screen]();if(!keep)window.scrollTo(0,0);
 if(tg){screen==='home'?tg.BackButton.hide():tg.BackButton.show()}}
function go(s){screen=s;if(s==='crew')crewData=null;if(s==='admins')admData=null;render()}
document.addEventListener('click',e=>{const t=e.target;let el;
 if(el=t.closest('[data-tab]')){tap();shotsTab=+el.dataset.tab;render(1);return}
 if(el=t.closest('[data-go]')){tap();go(el.dataset.go);return}
 if(el=t.closest('[data-open]')){openK=openK===el.dataset.open?null:el.dataset.open;render(1);return}
 if(el=t.closest('[data-s]')){tap();const k=el.dataset.s;done[k]?delete done[k]:done[k]=1;save('done3',done);render(1);return}
 if(t.closest('[data-save]')){tap();crewSave();return}
 if(el=t.closest('[data-adm]')){tap();const q=el.dataset.adm.split(':');api('/api/admins',{uid:+q[0],on:q[1]==='1'}).then(loadAdm).catch(()=>note('Не получилось.'));return}
 if(t.closest('[data-reset]')){done={};save('done3',done);render(1)}});
document.addEventListener('change',e=>{const x=e.target.closest&&e.target.closest('[data-pick]');if(x)crewDraft[x.dataset.pick]=+x.value});
render();
if(window.Telegram&&Telegram.WebApp&&!tg)initTg();
</script>
</body>
</html>
